<div class="auth-view credentials-view">
  <div class="form-group">
    <label>Código de Empleado / Usuario</label>
    <div class="input-wrapper">
      <span>▣</span>
      <input
        type="text"
        placeholder="ej. EMP-091"
        [value]="username"
        (input)="usernameChange.emit($any($event.target).value)"
      />
    </div>
  </div>

  <div class="form-group">
    <div class="password-label">
      <label>Contraseña Maestra</label>
      <a href="#">¿Olvidaste tu PIN?</a>
    </div>

    <div class="input-wrapper">
      <span>🔒</span>
      <input
        [type]="passwordVisible ? 'text' : 'password'"
        placeholder="Contraseña de acceso"
        [value]="password"
        (input)="passwordChange.emit($any($event.target).value)"
      />
      <button type="button" class="visibility-button" (click)="togglePasswordVisibility()">
        {{ passwordVisible ? '◉' : '◌' }}
      </button>
    </div>
  </div>

  <div class="cash-info">
    <div>
      <span class="cash-icon">▣</span>
      <span>Arqueo Inicial: $1,500.00 MXN</span>
    </div>
    <strong>VERIFICADO</strong>
  </div>
</div>
