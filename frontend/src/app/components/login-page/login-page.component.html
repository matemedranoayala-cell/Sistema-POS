<div class="fondo-oscuro">
  <div class="tarjeta-login">

    <div class="seccion-formulario">
      <div class="contenido-formulario">

        <div class="encabezado-logo">
          <h1 class="titulo-login">KOMBAT<br>MANAGER</h1>
          <img src="/kombat_managerpp.jpg" alt="Logo" class="logo-pequeno">
        </div>

        <p class="subtitulo-login">Hoy es un nuevo día. Inicia sesión para gestionar tu academia.</p>

        <form>
          <app-entrada-texto
            etiqueta="Correo Electrónico o Usuario"
            marcador="ejemplo@correo.com"
            [(valor)]="usuario"
          ></app-entrada-texto>

          <app-entrada-texto
            etiqueta="Contraseña"
            marcador="Mínimo 8 caracteres"
            tipo="password"
            [(valor)]="contrasena"
          ></app-entrada-texto>

          <div class="opciones-extra">
            <a href="#" class="enlace-olvido">¿Olvidaste tu contraseña?</a>
          </div>

          <p class="mensaje-error" *ngIf="mensajeError">{{ mensajeError }}</p>

          <app-boton-primario
            texto="Iniciar Sesión"
            tipo="button"
            [deshabilitado]="cargando"
            (onClick)="iniciarSesion()"
          ></app-boton-primario>
        </form>

        <div class="pie-pagina">
          <p>© 2026 Kombat Manager. Todos los derechos reservados.</p>
        </div>
      </div>
    </div>

    <div class="seccion-imagen">
      <img src="/moess.jpg" alt="Imagen Lateral" class="imagen-decorativa">
    </div>

  </div>
</div>
