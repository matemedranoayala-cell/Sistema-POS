<div class="login-wrapper">
  <div class="login-box">

    <div class="clock-pill">
      <span class="pulse-dot"></span>
      <span class="time-text">{{ currentTime }}</span>
    </div>

    <div class="header">
      <div class="brand">
        <img src="/kombat_managerpp.jpg" alt="Altitud Logo" class="logo" (click)="triggerSecretAdmin()">
        <div class="brand-text">
          <h1>KOMBAT MANAGER</h1>
          <p>ACCESO OPERATIVO</p>
        </div>
      </div>
    </div>

    <div class="branch-selector">
      <span class="section-title">SUCURSAL ACTIVA</span>
      <div class="branch-buttons">
        <button
          *ngFor="let sucursal of sucursales"
          type="button"
          [class.active]="sucursal === sucursalSeleccionada"
          (click)="seleccionarSucursal(sucursal)">
          {{ sucursal }}
        </button>
      </div>
    </div>

    <form (submit)="triggerLogin(); $event.preventDefault()">

      <div class="users-section" *ngIf="!showSecretLogin">
        <span class="section-title">SELECCIONAR OPERADOR</span>
        <div class="cards-grid">
          <div
            *ngFor="let user of usuariosPreguardados"
            class="user-card"
            [class.selected]="usuarioSeleccionado.id === user.id"
            (click)="seleccionarUsuario(user)">

            <div class="avatar-container">
              <div class="avatar">{{ user.iniciales }}</div>
              <div class="check-icon" *ngIf="usuarioSeleccionado.id === user.id">✓</div>
            </div>

            <div class="user-info">
              <span class="user-name">{{ user.nombre }}</span>
              <span class="user-role">{{ user.rol }}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="secret-login-section" *ngIf="showSecretLogin">
        <div class="secret-header">
          <span class="section-title">ACCESO SUPER ADMIN</span>
          <span class="cancel-secret" (click)="cancelSecretLogin()">Volver</span>
        </div>
        <div class="input-group">
          <label>USUARIO MAESTRO</label>
          <input type="text" [(ngModel)]="usernameManual" name="usernameManual" autocomplete="off">
        </div>
      </div>

      <div class="password-section">
        <div class="input-group">
          <label>CONTRASEÑA</label>
          <input type="password" [(ngModel)]="password" name="password" required>
        </div>

        <label class="checkbox-container">
          <input type="checkbox" [(ngModel)]="keepSession" name="keepSession">
          <span class="checkmark"></span>
          Mantener sesión iniciada
        </label>
      </div>

      <div *ngIf="loginMessage" class="error-message">
        {{ loginMessage }}
      </div>

      <button type="submit" class="neon-btn" [disabled]="isLoading">
        {{ isLoading ? 'VERIFICANDO...' : 'INICIAR TURNO' }}
      </button>

    </form>
  </div>
</div>
