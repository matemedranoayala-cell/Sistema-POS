<div
  (click)="cerrar.emit()"
  style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(17, 24, 39, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;">

  <div
    (click)="$event.stopPropagation()"
    style="background: #ffffff; width: 100%; max-width: 480px; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);">

    <div style="padding: 20px 28px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700; color: #111827;">Cierre de Caja Tienda</h2>
      <button type="button" (click)="cerrar.emit()" style="background: none; border: none; color: #6b7280; cursor: pointer;">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="22" height="22">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 16px;">
      <div style="background: #f3f4f6; padding: 16px; border-radius: 8px;">
        <p style="margin: 0 0 6px 0; font-size: 13px; color: #4b5563;">Efectivo de ventas pagadas hoy:</p>
        <h3 style="margin: 0; font-size: 24px; color: #10b981;">Bs {{ ventasTurno | number:'1.2-2' }}</h3>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 13px; font-weight: 600; color: #374151;">Efectivo Físico en Cajón (Bs)</label>
        <input
          type="number"
          min="0"
          step="0.5"
          [(ngModel)]="montoFisico"
          placeholder="Ej. 250.00"
          style="padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">

        <small
          *ngIf="diferencia !== null"
          [style.color]="diferencia === 0 ? '#10b981' : (diferencia > 0 ? '#f59e0b' : '#ef4444')"
          style="font-weight: 700; font-size: 13px;">
          {{ diferencia === 0 ? 'Cuadre exacto' : (diferencia > 0 ? 'Sobrante: Bs ' + diferencia : 'Faltante: Bs ' + (-diferencia)) }}
        </small>
      </div>
    </div>

    <div style="padding: 16px 28px; background: #f9fafb; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 12px;">
      <button type="button" (click)="cerrar.emit()" style="background: #ffffff; border: 1px solid #d1d5db; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;">
        Cancelar
      </button>
      <button type="button" (click)="guardar()" style="background: #111827; color: #ffffff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;">
        Confirmar Cierre
      </button>
    </div>

  </div>
</div>
