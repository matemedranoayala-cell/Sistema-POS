<div
  (click)="cerrar.emit()"
  style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(17, 24, 39, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000;">

  <div
    (click)="$event.stopPropagation()"
    style="background: #ffffff; width: 100%; max-width: 560px; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);">

    <div style="padding: 20px 28px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700; color: #111827;">Exportar Reporte de Tienda (Excel)</h2>
      <button type="button" (click)="cerrar.emit()" style="background: none; border: none; color: #6b7280; cursor: pointer;">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="22" height="22">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div style="padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 13px; font-weight: 600; color: #374151;">Filtrar por Categoría</label>
        <select [(ngModel)]="categoria" style="padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
          <option value="todas">Todas las categorías</option>
          <option *ngFor="let cat of categorias" [value]="cat">Solo {{ cat }}</option>
        </select>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 13px; font-weight: 600; color: #374151;">Desde (Fecha Inicial)</label>
        <input type="date" [(ngModel)]="fechaInicio" [max]="fechaMaximaVisible" style="padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 13px; font-weight: 600; color: #374151;">Hasta (Fecha Final)</label>
        <input type="date" [(ngModel)]="fechaFin" [max]="fechaMaximaVisible" style="padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;">
      </div>
    </div>

    <div style="padding: 16px 28px; background: #f9fafb; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 12px;">
      <button type="button" (click)="cerrar.emit()" style="background: #ffffff; border: 1px solid #d1d5db; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;">
        Cancelar
      </button>
      <button type="button" (click)="dispararExportacion()" style="background: #166534; color: #ffffff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;">
        Descargar .XLSX
      </button>
    </div>

  </div>
</div>
