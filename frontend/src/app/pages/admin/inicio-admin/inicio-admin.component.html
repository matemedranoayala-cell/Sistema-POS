<div class="contenedor-principal">
  <app-barra-superior-admin
    (crearUsuario)="abrirCreacion()"
    (exportarExcel)="abrirFiltrosExportacion()">
  </app-barra-superior-admin>

  <div class="contenido-panel">
    <div class="cabecera-seccion">
      <h2>Centro de Control Operativo</h2>
      <p>Supervisión en tiempo real de recepcionistas, tienda y entrenadores</p>
    </div>

    <div class="grid-metricas">
      <app-tarjeta-metrica
        titulo="Ingresos Consolidados"
        [valor]="ingresosTexto"
        [alerta]="false"
        (abrir)="abrirGrafico('ingresos')">
      </app-tarjeta-metrica>

      <app-tarjeta-metrica
        titulo="Ocupación Global"
        [valor]="ocupacionTexto"
        [alerta]="false"
        (abrir)="abrirGrafico('ocupacion')">
      </app-tarjeta-metrica>

      <app-tarjeta-metrica
        titulo="Daños por Firmar"
        [valor]="danosTexto"
        [alerta]="tieneDanos"
        (abrir)="abrirGrafico('danos')">
      </app-tarjeta-metrica>
    </div>

    <div class="grid-contenido">
      <div class="col-logs">
        <app-logs-paginados></app-logs-paginados>
      </div>
      <div class="col-usuarios">
        <app-usuarios-activos (abrirGestion)="abrirGestionUsuarios()"></app-usuarios-activos>
      </div>
    </div>
  </div>
</div>

<app-modal-crear-usuario
  *ngIf="mostrarModalUsuario"
  (usuarioCreado)="refrescarPaneles()"
  (cerrar)="mostrarModalUsuario = false; refrescarPaneles()">
</app-modal-crear-usuario>

<app-modal-exportar
  *ngIf="mostrarModalExportar"
  (cerrar)="mostrarModalExportar = false">
</app-modal-exportar>

<app-modal-graficos
  *ngIf="mostrarModalGraficos"
  [tipoGrafico]="tipoGraficoActual"
  (cerrar)="mostrarModalGraficos = false; cargarMetricas()">
</app-modal-graficos>

<app-modal-gestion-usuarios
  *ngIf="mostrarModalGestion"
  (actualizado)="refrescarPaneles()"
  (cerrar)="mostrarModalGestion = false; refrescarPaneles()">
</app-modal-gestion-usuarios>
