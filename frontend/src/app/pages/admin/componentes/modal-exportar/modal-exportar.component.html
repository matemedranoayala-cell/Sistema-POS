<div class="fondo-modal-exportar" (click)="cerrar.emit()" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 9999;">

  <div class="tarjeta-modal" style="width: 500px; max-width: 90vw; background: #ffffff; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);" (click)="$event.stopPropagation()">

    <div class="cabecera-modal" style="padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; border-radius: 12px 12px 0 0;">
      <h2 style="color: #0f172a; margin: 0; font-size: 1.25rem; font-weight: 700;">Exportar Reporte Global</h2>
      <button type="button" (click)="cerrar.emit()" style="background: transparent; border: none; color: #94a3b8; font-size: 1.25rem; cursor: pointer;">✕</button>
    </div>

    <div class="cuerpo-modal" style="padding: 24px; color: #334155; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; gap: 16px;">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 0.85rem; color: #334155; font-weight: 600;">Desde la fecha:</label>
          <input
            type="date"
            [(ngModel)]="filtroExcel.fechaInicio"
            [max]="fechaMaxima"
            style="padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; width: 100%; font-family: inherit;">
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 0.85rem; color: #334155; font-weight: 600;">Hasta la fecha:</label>
          <input
            type="date"
            [(ngModel)]="filtroExcel.fechaFin"
            [max]="fechaMaxima"
            style="padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; width: 100%; font-family: inherit;">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="font-size: 0.85rem; color: #334155; font-weight: 600;">Filtrar por Área / Rol:</label>
        <select [(ngModel)]="filtroExcel.rol" style="padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; width: 100%; font-family: inherit;">
          <option value="todos">Todo el Personal (Global)</option>
          <option value="recepcion">Solo Recepción y Caja</option>
          <option value="coach">Solo Coaches (Área de Tatami)</option>
        </select>
      </div>
    </div>

    <div class="pie-modal" style="padding: 16px 24px; border-top: 1px solid #f1f5f9; display: flex; justify-content: flex-end; gap: 12px; border-radius: 0 0 12px 12px;">
      <button type="button" (click)="cerrar.emit()" style="padding: 10px 18px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; color: #334155; font-weight: 500; cursor: pointer;">Cancelar</button>
      <button type="button" (click)="descargarExcel()" style="padding: 10px 18px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: 600; cursor: pointer;">Descargar Excel</button>
    </div>
  </div>
</div>
