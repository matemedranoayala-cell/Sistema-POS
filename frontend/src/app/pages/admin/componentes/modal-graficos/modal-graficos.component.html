<div
  (click)="cerrar.emit()"
  style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 9999;">

  <div
    (click)="$event.stopPropagation()"
    style="width: 680px; max-width: 95vw; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column;">

    <div style="padding: 20px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2 style="margin: 0; font-size: 1.25rem; color: #0f172a; font-weight: 700;">{{ tituloModal }}</h2>
        <p style="margin: 4px 0 0 0; font-size: 0.85rem; color: #64748b;">{{ subtituloModal }}</p>
      </div>
      <button
        type="button"
        (click)="cerrar.emit()"
        style="background: transparent; border: none; color: #64748b; cursor: pointer; display: flex; align-items: center;">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="22" height="22">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div style="padding: 24px; display: flex; flex-direction: column; gap: 20px; max-height: 75vh; overflow-y: auto;">
      <div style="background: #0f172a; color: #ffffff; padding: 16px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.9rem; color: #94a3b8; font-weight: 500;">Total Consolidado en Base de Datos</span>
        <strong style="font-size: 1.5rem; font-weight: 700;">{{ totalPrincipal }}</strong>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div *ngFor="let b of barras" style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; color: #334155;">
            <span>{{ b.etiqueta }}</span>
            <span>{{ b.texto }} ({{ b.porcentaje }}%)</span>
          </div>
          <div style="width: 100%; height: 12px; background: #f1f5f9; border-radius: 999px; overflow: hidden;">
            <div
              [style.width.%]="b.porcentaje > 0 ? b.porcentaje : 3"
              [style.background]="b.color"
              style="height: 100%; border-radius: 999px; transition: width 0.4s ease;">
            </div>
          </div>
        </div>
      </div>

      <div style="border-top: 1px solid #e2e8f0; padding-top: 16px;">
        <h4 style="margin: 0 0 12px 0; font-size: 0.9rem; color: #475569; font-weight: 700;">Últimos Registros</h4>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div
            *ngFor="let d of detalles"
            style="padding: 10px 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div style="font-size: 0.85rem; font-weight: 700; color: #0f172a;">{{ d.titulo }}</div>
              <div style="font-size: 0.78rem; color: #64748b;">{{ d.subtitulo }}</div>
            </div>
            <span style="font-size: 0.85rem; font-weight: 700; color: #2563eb;">{{ d.derecha }}</span>
          </div>

          <div *ngIf="detalles.length === 0" style="text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 12px;">
            Sin registros recientes en esta categoría.
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 14px 24px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end;">
      <button
        type="button"
        (click)="cerrar.emit()"
        style="padding: 8px 20px; background: #0f172a; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">
        Cerrar
      </button>
    </div>

  </div>
</div>
