<div class="tarjeta-metrica" [class.borde-alerta]="alerta" style="display: flex; justify-content: space-between; align-items: flex-start; padding: 20px; background: #1a1c26; border: 1px solid #2a2d3d; border-radius: 12px; height: 100%;">
  <div class="info">
    <p class="titulo" style="color: #94a3b8; font-size: 0.85rem; margin: 0 0 8px 0;">{{ titulo }}</p>
    <h3 class="valor" [class.texto-alerta]="alerta" style="color: #fff; font-size: 1.5rem; margin: 0; font-weight: bold;">
      {{ valor }}
    </h3>
  </div>
  <button
    (click)="abrir.emit()"
    style="background: transparent; color: #3b82f6; border: 1px solid #2a2d3d; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease;">
    Ver gráfico
  </button>
</div>
