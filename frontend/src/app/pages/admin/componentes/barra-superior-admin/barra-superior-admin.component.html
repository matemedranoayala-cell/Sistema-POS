<header class="top-header">
  <div class="header-left">
    <img src="/kombat_managerpp.jpg" alt="Logo" class="logo-org">
    <h2>Panel de Supervisión Administrativa</h2>
    <span class="divider">|</span>
    <span class="date">{{ fechaActual }}</span>
  </div>
  <div class="header-right">
    <span>Operador: <strong>{{ usuarioActual }}</strong></span>
    <button class="btn-primario" (click)="crearUsuario.emit()">+ Crear Usuario</button>
    <button class="btn-secundario" (click)="exportarExcel.emit()">Exportar Reporte Global</button>
    <button class="btn-logout" (click)="cerrarSesion()">Cerrar Sesión</button>
  </div>
</header>
