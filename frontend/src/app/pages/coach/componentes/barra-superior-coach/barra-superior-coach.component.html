<header class="top-header">
  <div class="header-left">
    <img src="/kombat_managerpp.jpg" alt="Logo" class="logo-org">
    <h2>Panel de Entrenador</h2>
    <span class="divider">|</span>
    <span class="date">{{ fechaActual }}</span>
  </div>
  <div class="header-right" style="display: flex; align-items: center; gap: 10px;">
    <span style="background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600;">
       {{ textoClaseBarra }}
    </span>
    <button
      type="button"
      (click)="abrirMisHorarios.emit()"
      style="background: #2563eb; color: #ffffff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;">
      Mis Horarios
    </button>
    <span><strong>{{ usuarioActual }}</strong></span>
    <span class="status-badge" [ngClass]="claseActiva ? 'green' : 'gray'">
      {{ claseActiva ? 'EN CLASE' : 'ESPERANDO TURNO' }}
    </span>
    <button class="btn-logout" (click)="cerrarSesion()">Cerrar Sesión</button>
  </div>
</header>
