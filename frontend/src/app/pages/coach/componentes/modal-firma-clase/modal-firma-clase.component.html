<div class="fondo-modal" (click)="cerrar.emit()" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; z-index: 9999;">
  <div class="tarjeta-modal" (click)="$event.stopPropagation()" style="width: 500px; max-width: 95vw; background: #ffffff; border-radius: 12px; overflow: hidden;">

    <div class="cabecera-modal">
      <h2>Firma de Clase Finalizada</h2>
      <button type="button" class="boton-cerrar" (click)="cerrar.emit()" style="display: flex; align-items: center; justify-content: center;">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="cuerpo-modal">
      <div class="grupo-select" style="margin-bottom: 1.5rem;">
        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #1f2937;">Horario de Trabajo Seleccionado</label>

        <div style="display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto;">
          <div
            *ngFor="let h of horariosCoach"
            (click)="seleccionarHorario(h)"
            [ngStyle]="{
              'border-color': horarioSeleccionado === h ? '#2563eb' : '#e5e7eb',
              'background': horarioSeleccionado === h ? '#eff6ff' : '#f9fafb'
            }"
            style="padding: 12px 14px; border: 2px solid; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.9rem; font-weight: 600; color: #0f172a; display: inline-flex; align-items: center; gap: 8px;">
              <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" style="color: #2563eb;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              {{ h }}
            </span>
            <span *ngIf="horarioSeleccionado === h" style="font-size: 0.75rem; font-weight: 700; color: #2563eb;">Seleccionado</span>
          </div>
        </div>
      </div>

      <div class="grupo-select">
        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #1f2937;">Total de Alumnos Asistentes</label>
        <input
          type="number"
          min="1"
          [(ngModel)]="cantidadAlumnos"
          (keyup.enter)="guardarFirma()"
          class="select-base text-center font-bold"
          placeholder="Ej. 14">
      </div>

      <p style="font-size: 12px; color: #6b7280; text-align: center; margin-top: 15px;">
        Al hacer clic en Guardar, estás firmando digitalmente la finalización de tu clase.
      </p>
    </div>

    <div class="pie-modal">
      <button type="button" class="boton-secundario" (click)="cerrar.emit()">Cancelar</button>
      <button type="button" class="boton-secundario" style="background-color: #10b981; color: white; border: none;" (click)="guardarFirma()">Firma Digital y Guardar</button>
    </div>

  </div>
</div>
