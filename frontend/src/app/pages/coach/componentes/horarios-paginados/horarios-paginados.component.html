<button
  type="button"
  (click)="abrirHorarios()"
  style="width: 100%; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 28px 32px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04); text-align: left; transition: all 0.2s ease;">

  <div style="display: flex; align-items: center; gap: 20px;">
    <div style="width: 54px; height: 54px; border-radius: 12px; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center;">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="28" height="28">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
      </svg>
    </div>
    <div>
      <h3 style="margin: 0 0 6px 0; font-size: 1.25rem; color: #0f172a; font-weight: 700;">Horarios Oficiales KOMBAT</h3>
      <p style="margin: 0; font-size: 0.95rem; color: #64748b;">Distribución de disciplinas en tatamis y octágono. Haz clic para ver todos los horarios.</p>
    </div>
  </div>

  <span style="background: #2563eb; color: #ffffff; padding: 12px 24px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; white-space: nowrap;">
    Ver Horarios
  </span>
</button>

<div
  *ngIf="mostrarFormularioHorarios"
  (click)="cerrarHorarios()"
  style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.65); display: flex; align-items: center; justify-content: center; z-index: 9999;">

  <div
    (click)="$event.stopPropagation()"
    style="width: 920px; max-width: 95vw; background: #ffffff; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);">

    <div style="padding: 20px 28px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: #f8fafc;">
      <div>
        <h3 style="margin: 0 0 4px 0; font-size: 1.3rem; color: #0f172a; font-weight: 700;">Horarios Oficiales KOMBAT</h3>
        <p style="margin: 0; font-size: 0.9rem; color: #64748b;">Distribución de disciplinas en tatamis y octágono.</p>
      </div>
      <button
        type="button"
        (click)="cerrarHorarios()"
        style="background: transparent; border: none; color: #64748b; cursor: pointer; padding: 4px; display: flex; align-items: center;">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="22" height="22">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div style="padding: 24px 28px;">
      <div class="grid-horarios" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px;">
        <div
          class="tarjeta-horario"
          *ngFor="let item of horariosPaginados"
          style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; background: #ffffff;">
          <h4 style="margin: 0 0 12px 0; font-size: 1.05rem; color: #0f172a; font-weight: 700;">{{ item.disciplina }}</h4>
          <div class="lista-horas" style="display: flex; flex-direction: column; gap: 8px;">
            <span
              *ngFor="let hr of item.horarios"
              style="background: #f1f5f9; color: #334155; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 8px;">
              <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="16" height="16">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              {{ hr }}
            </span>
          </div>
        </div>
      </div>

      <app-paginacion
        [paginaActual]="paginaActual"
        [totalItems]="horarios.length"
        [itemsPorPagina]="itemsPorPagina"
        (cambioPagina)="actualizarPaginacion($event)">
      </app-paginacion>
    </div>

    <div style="padding: 14px 28px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; background: #f8fafc;">
      <button
        type="button"
        (click)="cerrarHorarios()"
        style="background: #0f172a; color: #ffffff; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 600; cursor: pointer;">
        Cerrar
      </button>
    </div>

  </div>
</div>
