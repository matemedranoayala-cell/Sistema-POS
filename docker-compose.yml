services:
  db:
    image: postgres:16-alpine
    container_name: kombat_postgres
    restart: always
    environment:
      POSTGRES_DB: kombat_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kombat_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: kombat_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: kombat_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: kombat_frontend
    restart: always
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data:
